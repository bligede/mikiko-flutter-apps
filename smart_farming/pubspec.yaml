name: smart_farming
description: "MVP aplikasi Smart Farming (Flutter): monitor sensor ESP32, irigasi otomatis, jadwal perawatan, analitik, dan chatbot AI."
publish_to: "none"
version: 0.3.0+3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  intl: ^0.20.2
  http: ^1.2.2
  shared_preferences: ^2.5.3
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
